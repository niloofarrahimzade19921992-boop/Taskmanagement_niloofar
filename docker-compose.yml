services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: projectdb
      POSTGRES_USER: projectapp
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - projectdb:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U projectapp -d projectdb"]
      interval: 5s
      retries: 10
  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__Default: Host=db;Port=5432;Database=projectdb;Username=projectapp;Password=${DB_PASSWORD}
      JWT_KEY: ${JWT_KEY:?Set JWT_KEY in .env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?Set ADMIN_USERNAME in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
    ports:
      - "127.0.0.1:8080:8080"
volumes:
  projectdb: